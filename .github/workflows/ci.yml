# Esteira de Integração Contínua (CI) - Atividade 6
#
# Dispara automaticamente sempre que um Pull Request é aberto ou atualizado
# com destino à branch main. O job sobe o ambiente (MySQL, Java, Node),
# instala as dependências, inicia a aplicação (API + client) e roda toda a
# suíte de testes (backend, frontend, API e E2E).

name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Banco de dados MySQL usado pela API durante os testes.
    # O serviço só fica disponível depois de passar no health check.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: social_media
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    # Variáveis lidas pela aplicação. As SPRING_DATASOURCE_* sobrescrevem o
    # application.properties, apontando a API para o MySQL deste ambiente.
    env:
      SPRING_DATASOURCE_URL: "jdbc:mysql://127.0.0.1:3306/social_media?allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      NEXT_PUBLIC_BASE_URL: http://localhost:8080

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # --- Testes de caixa-branca do backend (JUnit) ---
      - name: Testes do backend (JUnit)
        working-directory: api
        run: |
          chmod +x mvnw
          ./mvnw -B test

      # --- Testes de caixa-branca do frontend (Jest) ---
      - name: Instalar dependências do client
        working-directory: client
        run: npm ci

      - name: Testes do frontend (Jest)
        working-directory: client
        run: npm test

      # --- Subir a aplicação e rodar os testes de API + E2E (Playwright) ---
      - name: Instalar dependências dos testes
        working-directory: tests
        run: npm ci

      - name: Instalar navegadores do Playwright
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Subir aplicação e rodar testes de API e E2E
        run: |
          # Inicia a API em segundo plano e espera a porta 8080 responder.
          (cd api && chmod +x mvnw && nohup ./mvnw -B spring-boot:run > ../api.log 2>&1 &)
          echo "Aguardando a API em :8080..."
          for i in $(seq 1 60); do
            if curl -s http://localhost:8080/ >/dev/null 2>&1; then echo "API no ar"; break; fi
            sleep 5
            if [ "$i" -eq 60 ]; then echo "API nao subiu a tempo"; cat api.log; exit 1; fi
          done

          # Inicia o client em segundo plano e espera a porta 3000 responder.
          (cd client && nohup npm run dev > ../client.log 2>&1 &)
          echo "Aguardando o client em :3000..."
          for i in $(seq 1 40); do
            if curl -s http://localhost:3000 >/dev/null 2>&1; then echo "Client no ar"; break; fi
            sleep 3
            if [ "$i" -eq 40 ]; then echo "Client nao subiu a tempo"; cat client.log; exit 1; fi
          done

          # Roda a suíte completa do Playwright (projetos api e e2e).
          cd tests && npx playwright test

      # Guarda o relatório do Playwright como artefato, mesmo se algo falhar.
      - name: Salvar relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7